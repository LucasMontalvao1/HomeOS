version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: homeos-db
    environment:
      POSTGRES_USER: homeos
      POSTGRES_PASSWORD: homeos_password
      POSTGRES_DB: homeos_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homeos"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
